

{%extends 'base.html'%}
{%block head%}
<title>Password checker</title>
{%endblock%}

{%block body%}
    <div class="content">
        <h1>Edit your password</h1>
        <form action="/edit/{{account.id}}" method="POST">
            <input type="text" name="name" id="name" value="{{account.name}}">
            <input type="text" name="category" id="category" value="{{account.category or ''}}">
        
            <input type="submit" value="Save">

        </form>
    </div>

{%endblock%}
